job.agent.enabled=true
job.auto.submit=false
job.execution.mode=DISCOVER_ONLY
job.resume.path=private/resume.docx
job.applicant.profile.path=private/applicant.properties
job.minimum.match.score=60
job.location=San Francisco Bay Area
job.include.remote=true
job.maximum.posting.age.days=30
job.max.discovered.per.run=500
job.max.applications.per.run=100
job.max.submissions.per.run=1
job.validation.failure.stop.threshold=1
job.database.path=data/applications.db
job.report.csv=data/applications.csv
job.timeout.seconds=60
browser.headless=true
browser.session.directory=private/browser-sessions
email.provider=gmail
email.gmail.enabled=false
email.gmail.oauth.client.path=private/google-oauth-client.json
email.gmail.keychain.service=AutoJobApplyAgent.Gmail
# Optional public Greenhouse board tokens, comma separated. These are discovery-only.
greenhouse.board.tokens=
# Bounded, persisted Greenhouse directory slice; each run advances its cursor.
greenhouse.max.boards.per.run=50
# Submission remains disabled unless an employer has provided an authorized integration.
authorized.submission.enabled=false
